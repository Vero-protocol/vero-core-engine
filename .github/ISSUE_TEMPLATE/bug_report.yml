name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which module is affected?
      options:
        - engine-core
        - engine-bridge
        - dashboard
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Start '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **If you pick this issue up:** the pull request that closes it needs a
        **detailed description** — what was wrong, the approach you took, anything
        the reviewer should look at closely, and how you verified it. A one-line
        description will be sent back before review. See CONTRIBUTING.md.
