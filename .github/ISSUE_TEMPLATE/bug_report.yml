name: Bug report
description: Report a reproducible defect in vero-core-engine
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, do not use this public form; follow the private reporting process in SECURITY.md.

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      description: Which part of the project is affected?
      options:
        - engine-core
        - engine-bridge
        - dashboard
        - Other / cross-module
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: Describe the observed result, including relevant errors.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, OS, runtime, network, or deployment details.
      placeholder: "Example: Ubuntu 24.04, Node 20, Rust stable, testnet"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, transaction hashes, or other useful context. Remove secrets and sensitive data before posting.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive information.
          required: true
