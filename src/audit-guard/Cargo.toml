[package]
name = "vero-audit-guard"
version = "0.1.0"
edition = "2021"
description = "Vero audit-guard — observational policy-bundle signature verification (VAG-003)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
ed25519-dalek = "2"
